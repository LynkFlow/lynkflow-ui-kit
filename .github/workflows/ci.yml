name: CI

# @lynkflow/config is a real, published registry dependency here
# (package.json: "^0.0.2") -- the earlier sibling-checkout-of-lynkflow-config
# workaround this workflow used to need is gone; npm just fetches it from
# GitHub Packages like any other dependency. That fetch needs auth
# (GitHub Packages has no anonymous install path, unlike a plain git
# checkout of a public repo), which is why the Install step below sets
# LYNKFLOW_NPM_TOKEN -- .npmrc references it as ${LYNKFLOW_NPM_TOKEN}, and
# without this env var that reference resolves to nothing, producing a 401
# ("unauthenticated: User cannot be authenticated with the token provided")
# regardless of whether the underlying secret's token value is valid. This
# exact gap -- present here and in lynkflow-types, absent in
# lynkflow-shell/auth-ui/lynkflow-mfe-template's workflows -- was the root
# cause of a real CI failure diagnosed and fixed on 15 Aug 2026.
#
# Requires a repo secret: CROSS_REPO_PAT -- a classic PAT with `read:packages`
# scope (the `repo` scope this used to also need, for the sibling checkout,
# is no longer required now that the checkout step is gone). Add it under
# Settings -> Secrets and variables -> Actions.

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lynkflow-ui-kit
    steps:
      - name: Checkout lynkflow-ui-kit
        uses: actions/checkout@v4
        with:
          path: lynkflow-ui-kit

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: "lynkflow-ui-kit/.nvmrc"
          cache: "npm"
          cache-dependency-path: lynkflow-ui-kit/package-lock.json

      # .npmrc is already committed (install-links=true, and a
      # //npm.pkg.github.com/:_authToken=${LYNKFLOW_NPM_TOKEN} line for the
      # real @lynkflow/config registry fetch) -- just needs LYNKFLOW_NPM_TOKEN
      # set for npm's ${VAR} expansion to resolve it.
      - name: Install
        run: npm install --install-links
        env:
          LYNKFLOW_NPM_TOKEN: ${{ secrets.CROSS_REPO_PAT }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage report -- not a gate here, see testing.md)
        run: npm run test:coverage

      # tsup (JS + types) + Tailwind CLI (dist/styles.css) -- see
      # docs/packages-guide.md's ui-kit section.
      - name: Build
        run: npm run build
